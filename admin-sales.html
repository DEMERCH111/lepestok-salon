<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продажи — Лепесток · Админка</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__logo">Лепесток</div>
            <nav class="admin-menu">
        <a href="admin.html" class="admin-menu__link"><span class="admin-menu__icon">📦</span> Товары</a>
        <a href="admin-incomings.html" class="admin-menu__link"><span class="admin-menu__icon">📥</span> Поступления</a>
        <a href="admin-appointments.html" class="admin-menu__link"><span class="admin-menu__icon">📅</span> Записи</a>
        <a href="admin-clients.html" class="admin-menu__link"><span class="admin-menu__icon">👥</span> Клиенты</a>
        <a href="admin-sales.html" class="admin-menu__link active"><span class="admin-menu__icon">💰</span> Продажи</a>
        <a href="admin-rentals.html" class="admin-menu__link"><span class="admin-menu__icon">👗</span> Аренда</a>
        <a href="admin-analytics.html" class="admin-menu__link"><span class="admin-menu__icon">📊</span> Аналитика</a>
        <a href="admin-partners.html" class="admin-menu__link"><span class="admin-menu__icon">🤝</span> Партнёры</a>
        <a href="admin-promocodes.html" class="admin-menu__link"><span class="admin-menu__icon">🏷️</span> Все промокоды</a>
        <div class="admin-menu__divider" id="adminOnlyDivider"></div>
        <a href="admin-profile.html" class="admin-menu__link"><span class="admin-menu__icon">⚙️</span> Профиль</a>
        <a href="admin-staff.html" class="admin-menu__link" id="staffMenuLink"><span class="admin-menu__icon">🔐</span> Сотрудники</a>
        <div class="admin-menu__divider"></div>
        <a href="index.html" target="_blank" class="admin-menu__link"><span class="admin-menu__icon">↗</span> Открыть сайт</a>
      </nav>
      <div class="admin-sidebar__bottom">
        <div class="admin-user">👤 <span id="adminUserLabel">admin</span></div>
        <button class="btn btn--outline btn--sm" id="logoutBtn" style="width:100%">Выйти</button>
      </div>
    </aside>

    <main class="admin-content">
         <div class="admin-toolbar">
        <h1>Продажи в салоне</h1>
        <div style="display:flex; gap:10px;">
          <button class="btn btn--outline" id="exportSalesBtn">Выгрузить в Excel</button>
          <button class="btn btn--primary" id="addSaleBtn">+ Внести продажу</button>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Дата</th>
              <th>Товар</th>
              <th>Клиент</th>
              <th>Сумма</th>
              <th>Оплата</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="salesBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- МОДАЛКА ФОРМЫ ПРОДАЖИ -->
  <div class="modal" id="saleModal">
    <div class="modal__content modal__content--wide">
      <button class="modal__close" data-close="saleModal">×</button>
      <h3>Внести продажу</h3>
      
      <form id="saleForm" class="admin-form">
        
        <!-- Тип операции (на весь чек) -->
        <div style="background: #fdf8f5; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--dark-pink);">
          <label style="margin-bottom: 0;">
            Тип операции *
            <select id="saleItemType" required>
              <option value="Продажа">Продажа</option>
              <option value="Аренда">Аренда</option>
            </select>
          </label>

          <!-- Поля для аренды (скрыты по умолчанию) -->
          <div id="rentalFieldsBlock" style="display: none; margin-top: 15px;">
            <div class="admin-form__row">
              <label>
                Дата выдачи *
                <input type="date" id="saleRentalDateOut">
              </label>
              <label>
                Планируемая дата возврата *
                <input type="date" id="saleRentalDateReturn">
              </label>
            </div>
          </div>
        </div>

        <!-- Блок добавления товаров -->
        <div style="background: #faf5f4; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
          <h4 style="font-size: 14px; margin-bottom: 10px; color: var(--dark-pink);">1. Добавьте товары в чек</h4>
          
          <label>
            Выбрать товар из каталога (необязательно)
            <select id="saleProductSelect">
              <option value="">-- Ввести вручную --</option>
            </select>
          </label>

          <div class="admin-form__row" style="align-items: end;">
            <label>
              Название товара (введите вручную или выберите выше)
              <input type="text" id="saleProductName" placeholder="Например: Платье «Ада»">
            </label>
            <label>
              Цена, ₽
              <input type="number" id="saleProductPrice" min="0" placeholder="0">
            </label>
          </div>
          
          <button type="button" class="btn btn--outline btn--sm" id="addItemToCartBtn" style="margin-top: 10px;">+ Добавить в чек</button>
          
          <!-- Список добавленных товаров -->
          <div id="saleItemsList" style="margin-top: 15px;"></div>
        </div>

        <!-- Общая сумма и оплата -->
        <div class="admin-form__row">
          <label>
            Итоговая сумма, ₽ *
            <input type="number" id="saleAmount" min="0" required placeholder="0" readonly style="background: #f0f0f0;">
          </label>
          <label>
            Способ оплаты *
            <select id="salePayment" required>
              <option value="Карта">Карта</option>
              <option value="Наличные">Наличные</option>
              <option value="Перевод">Перевод</option>
            </select>
          </label>
        </div>

        <!-- Клиент -->
        <label>
          Выбрать из базы клиентов (необязательно)
          <select id="saleClientSelect">
            <option value="">-- Новый клиент / Без имени --</option>
          </select>
        </label>

        <div class="admin-form__row">
          <label>
            ФИО клиента <span id="saleCustomerReq" style="color:#e63946; display:none;">*</span>
            <input type="text" id="saleCustomer" placeholder="Иванова Анна">
          </label>
          <label>
            Телефон клиента <span id="salePhoneReq" style="color:#e63946; display:none;">*</span>
            <input type="tel" id="salePhone" placeholder="+7 999 123-45-67">
          </label>
        </div>

        <div class="admin-form__actions">
          <button type="button" class="btn btn--outline" data-close="saleModal">Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить продажу</button>
        </div>
      </form>
    </div>
  </div>

<script type="module" src="js/admin-sales.js"></script>
</body>
</html>
